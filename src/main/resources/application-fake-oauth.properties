spring.config.activate.on-profile=fake-oauth

# Local and smoke-test-only OAuth provider. Never combine this profile with prod.
app.security.fake-oauth.client-id=${FAKE_OAUTH_CLIENT_ID:technical-interview-demo-smoke}
app.security.fake-oauth.client-secret=${FAKE_OAUTH_CLIENT_SECRET:technical-interview-demo-smoke-secret}
app.security.fake-oauth.login=${FAKE_OAUTH_LOGIN:smoke-user}
app.security.fake-oauth.display-name=${FAKE_OAUTH_DISPLAY_NAME:Smoke Test User}
app.security.fake-oauth.email=${FAKE_OAUTH_EMAIL:smoke-user@example.test}

app.security.oauth.providers.smoke.type=FAKE
app.security.oauth.providers.smoke.client-id=${FAKE_OAUTH_CLIENT_ID:technical-interview-demo-smoke}
app.security.oauth.providers.smoke.client-secret=${FAKE_OAUTH_CLIENT_SECRET:technical-interview-demo-smoke-secret}
app.security.oauth.providers.smoke.client-name=${FAKE_OAUTH_CLIENT_NAME:Smoke OAuth}
app.security.oauth.providers.smoke.authorization-uri=${FAKE_OAUTH_AUTHORIZATION_URI:/test-support/oauth2/authorize}
app.security.oauth.providers.smoke.token-uri=${FAKE_OAUTH_TOKEN_URI:http://127.0.0.1:8080/test-support/oauth2/token}
app.security.oauth.providers.smoke.user-info-uri=${FAKE_OAUTH_USER_INFO_URI:http://127.0.0.1:8080/test-support/oauth2/userinfo}
app.security.oauth.providers.smoke.scope=profile,email
app.security.oauth.providers.smoke.user-name-attribute=login
